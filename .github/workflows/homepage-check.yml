name: Homepage Check

on:
  schedule:
    # 매일 06:30 KST (전날 21:30 UTC). lineup-check 30분 뒤.
    - cron: "30 21 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/check-homepage.mjs"
      - ".github/workflows/homepage-check.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: homepage-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # 러너에 Google Chrome 이 깔려 있다. tesla.com 이 headless 를 막아서
      # 가상 화면(xvfb) 위에서 화면 있는 모드로 띄운다.
      - name: Read tesla.com/ko_kr
        id: check
        run: xvfb-run --auto-servernum node scripts/check-homepage.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-report-${{ github.run_id }}
          path: reports/homepage-*.json
          if-no-files-found: warn

      # 홈페이지는 테슬라 공식 판매 화면이라 확인된 가격·주문 막힘은 바로 반영한다.
      - name: Commit verified changes
        if: steps.check.outputs.auto_changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "tesla-kr-lineup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lineup_overrides.json reports/homepage-*.json
          git commit -m "auto: tesla.com 기준 라인업 갱신"
          git push

      # 사람이 판단할 것(처음 보는 트림, 페이지 못 읽음 등)은 이슈 하나에 모은다.
      - name: Open or update review issue
        if: steps.check.outputs.needs_review == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[homepage] 라인업 확인 필요"
          BODY=$(node -e "const r=require('./'+require('fs').readdirSync('reports').filter(f=>f.startsWith('homepage-')).sort().map(f=>'reports/'+f).pop());console.log(r.findings.map(f=>'- '+f.detail).join('\n'))")
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$(date -u +%F)"$'\n'"$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
